<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard AI - The Ultimate Edition</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Playfair+Display:wght@700;900&family=Poppins:wght@400;600;700;800&family=Montserrat:wght@600;700;800&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const cybersecurityTopics = {
            phishing: { title: "Phishing & Email Scams", emoji: "🎣", colors: ["#FF6B6B", "#E84545", "#C62E2E"] },
            whatsapp_upi: { title: "WhatsApp & UPI Frauds", emoji: "💸", colors: ["#4ECDC4", "#26A69A", "#00897B"] },
            ransomware: { title: "Ransomware Attacks", emoji: "🔒", colors: ["#F1948A", "#E57373", "#C62828"] },
            social_media: { title: "Social Media Safety", emoji: "📱", colors: ["#F7DC6F", "#FBC02D", "#F57F17"] },
            two_factor: { title: "Two-Factor Authentication", emoji: "🔑", colors: ["#FFA07A", "#FF7043", "#E64A19"] },
            deepfakes: { title: "Deepfakes & AI Scams", emoji: "🤖", colors: ["#85C1E2", "#42A5F5", "#1565C0"] },
        };

        const targetAudiences = { 
            employees: "Corporate Employees", 
            general: "General Public", 
            seniors: "Senior Citizens",
            youth: "Young Adults & Students",
        };

        const tones = { 
            professional: "Professional", 
            casual: "Casual & Friendly", 
            urgent: "Urgent & Alerting",
            educational: "Educational & Informative"
        };
        
        const genericTextLengths = {
            quick_take: { name: "Quick Take", desc: "~60 words" },
            briefing: { name: "Briefing", desc: "~120 words" },
            bollywood: { name: "Bollywood Story", desc: "Story Mode" },
            did_you_know: { name: "Did You Know?", desc: "Surprising Fact" }
        };

        const technicalTextLengths = {
            briefing: { name: "Executive Briefing", desc: "~150 words" },
            deep_dive: { name: "Strategic Deep Dive", desc: "~250 words" },
            future: { name: "Future-Forward Analysis", desc: "Predictive insights" },
            did_you_know: { name: "Did You Know?", desc: "Data Point" }
        };

        const backgroundTypes = {
            cinematic: "Cinematic Infographic",
            comic: "Comic Strip",
            canvas: "Abstract Art"
        };
        
        const generateCanvas = (colors, seed) => {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = 1080;
            const ctx = canvas.getContext('2d');
            const c1 = colors[Math.floor((seed * 3) % colors.length)];
            const grad = ctx.createRadialGradient(540,540,0,540,540,700);
            grad.addColorStop(0, c1);
            grad.addColorStop(1, '#050510');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1080, 1080);
            const vig = ctx.createRadialGradient(540,540,360,540,540,880);
            vig.addColorStop(0, 'rgba(0,0,0,0)');
            vig.addColorStop(1, 'rgba(0,0,0,0.5)');
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, 1080, 1080);
            return canvas.toDataURL('image/png');
        };

        function CybersecurityContentPlatform() {
            const [apiKey, setApiKey] = useState('');
            const [platform, setPlatform] = useState('linkedin');
            const [topic, setTopic] = useState('phishing');
            const [audience, setAudience] = useState('employees');
            const [contentType, setContentType] = useState('generic');
            const [tone, setTone] = useState('professional');
            const [textLength, setTextLength] = useState('briefing');
            const [backgroundType, setBackgroundType] = useState('cinematic');
            
            const [generatedText, setGeneratedText] = useState('');
            const [visualContent, setVisualContent] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');
            const [copySuccess, setCopySuccess] = useState('');
            const [downloadSuccess, setDownloadSuccess] = useState('');
            const [status, setStatus] = useState('');

            useEffect(() => {
                 const currentLengths = contentType === 'technical' ? technicalTextLengths : genericTextLengths;
                if (!currentLengths[textLength]) {
                    setTextLength(Object.keys(currentLengths)[0]);
                }
            }, [contentType, textLength]);

            const callGemini = async (prompt, key, isJson = false) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${key}`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { 
                            temperature: 1.3,
                            maxOutputTokens: 8192,
                            ...(isJson && { responseMimeType: "application/json" })
                        }
                    })
                });
                if (!res.ok) throw new Error(`API error: ${res.status} ${res.statusText}`);
                const data = await res.json();
                if (!data.candidates || data.candidates.length === 0) {
                     if (data.promptFeedback && data.promptFeedback.blockReason) { return `Content generation failed: ${data.promptFeedback.blockReason}.`; }
                    return 'Content generation failed: Empty response.';
                }
                const text = data.candidates[0]?.content?.parts?.[0]?.text;
                return text || 'Content generation failed: Empty text part.';
            };
            
            const generateHighQualityImage = async (prompt, key) => {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key=${key}`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ instances: [{ prompt }], parameters: { sampleCount: 1, aspectRatio: "1:1" } })
                    });
                    if (!res.ok) return null;
                    const data = await res.json();
                    const img = data?.predictions?.[0]?.bytesBase64Encoded;
                    return img ? `data:image/png;base64,${img}` : null;
                } catch (e) {
                    console.error("Error generating image:", e);
                    return null;
                }
            };
            
            const getPostPrompt = (topicDetails) => {
                if (contentType === 'technical') {
                    const technicalAudience = "CISOs, CTOs, and IT Heads";
                    switch (textLength) {
                        case 'briefing': return `Create a "Threat Intelligence Brief" for LinkedIn on "${topicDetails.title}" for ${technicalAudience}. TONE: Analytical, professional. STRUCTURE: **Threat Brief: [Topic Title]**\n**Attack Vector Analysis:** [Describe TTPs in 1-2 sentences.]\n**Business Impact:** [Outline consequences.]\n**Mitigation Strategy:**\n- **Technology:** [Suggest a specific technology.]\n- **Process:** [Suggest a process change.]\n- **People:** [Suggest a training initiative.]\nA proactive defense posture is our greatest asset. #ThreatIntel #${topic.replace(/_/g, '')}`;
                        case 'deep_dive': return `Create a "Strategic Analysis" for LinkedIn on "${topicDetails.title}" for ${technicalAudience}. TONE: In-depth, strategic. STRUCTURE: [An opening framing the topic as a business challenge.]\n**Deconstructing the Attack Chain:** [Map the threat to a framework like MITRE ATT&CK.]\n**Second-Order Risks:** [Discuss consequences beyond the initial breach.]\n**Building Resilience:**\n1. **Architectural Defense:** [Recommend an architecture change.]\n2. **Intelligence-Led Defense:** [Recommend integrating threat intelligence.]\n3. **Board-Level Reporting:** [Suggest how to communicate this risk.]\nSecurity is a foundational business principle. #CyberStrategy #${topic.replace(/_/g, '')}`;
                        case 'future': return `Create a "Future-Forward Analysis" for LinkedIn on "${topicDetails.title}" for ${technicalAudience}. TONE: Visionary, predictive. STRUCTURE: **The Future of [Topic Area]: A Strategic Forecast**\n[An opening statement looking 3-5 years ahead.]\n**Emerging Threat Vectors:**\n- [Predict a future attack method.]\n- [Predict another.]\n**Paradigm Shifts in Defense:**\n- [Suggest a future defensive strategy.]\n**Questions for the Board:**\n- [Pose 2-3 strategic questions for a CISO to ask their board.]\nAnticipating the future is the only way to secure it. #FutureofCyber #Innovation`;
                        case 'did_you_know': return `Create a "Did You Know?" data point for a technical/executive audience on "${topicDetails.title}". TONE: Factual, concise, and impactful. STRUCTURE: **Did You Know?**\n[State a specific, data-driven statistic or a little-known fact about the topic relevant to a CISO. Focus on business impact or emerging trends.]\n**Strategic Implication:** [In one sentence, explain what this data means for business strategy.]\n**Actionable Insight:** [Provide a high-level recommendation for leadership based on this fact.] #CyberIntel #${topic.replace(/_/g, '')}`;
                        default: return "Invalid technical format selected.";
                    }
                } else { // Generic Content
                    switch (textLength) {
                        case 'quick_take': return `Create a "Quick Take" post on "${topicDetails.title}". Short, impactful, and easy to understand. TONE: Clear, direct. STRUCTURE: [A powerful opening statement.]\n3 Golden Rules:\n1. [Rule 1]\n2. [Rule 2]\n3. [Rule 3]\n[A sharp concluding thought.] #CyberSecurity #${topic.replace(/_/g, '')}`;
                        case 'bollywood': return `You are a creative director. For the topic "${topicDetails.title}", brainstorm a unique micro-story plot with a distinct Indian context. Return a JSON object with {"character": "a relatable Indian character with a name and city, e.g., 'Anjali from Mumbai', 'Mr. Sharma from Delhi'", "plot": "a specific, unique scenario related to the topic that would be common in India, e.g., a fake electricity bill scam on WhatsApp, a deceptive job offer for an IT role in Bangalore"}.`;
                        case 'briefing': return `Create a "Briefing" post on "${topicDetails.title}". Use a simple, powerful analogy. TONE: Clear, insightful. STRUCTURE: [A strong opening.]\nThink of it this way: [Explain with a simple analogy.]\nThe real danger is [explain the core risk].\nMy 3-step defense:\n1. [Step 1]\n2. [Step 2]\n3. [Step 3]\nStay skeptical, stay safe. #CyberSecurity #${topic.replace(/_/g, '')}`;
                        case 'deep_dive': return `Create a "Deep Dive" post on "${topicDetails.title}". Tell a short, simple, and realistic story. TONE: Story-driven, educational. STRUCTURE: [An intriguing opening.]\nHere's a quick story: [Tell a simple, relatable story.]\nThe mistake was simple: [Explain the psychological trap].\nThis is a classic case of [Topic Name] that works by exploiting [e.g., our instinct to be helpful].\nHow to avoid this trap:\n- **Always Verify:** [Explain how].\n- **Look for Red Flags:** [List 2 simple flags].\n- **When in Doubt, Don't:** [Explain the safe action].\nOne moment of caution can prevent a crisis. #CyberSecurity #${topic.replace(/_/g, '')}`;
                        case 'did_you_know': return `Create a "Did You Know?" post for a general audience about "${topicDetails.title}". TONE: Surprising, simple, and memorable. STRUCTURE: **Did you know?**\n[State a single, surprising, and easy-to-understand fact or statistic about the topic.]\n**Why this matters:** [In one simple sentence, explain the real-world implication for a normal person.]\n[A short, actionable tip to protect themselves.] #CyberFacts #${topic.replace(/_/g, '')}`;
                        default: return "Invalid generic format selected.";
                    }
                }
            };

            const handleGenerate = async () => {
                if (!apiKey) { setError('Please enter a valid API key.'); return; }
                setIsLoading(true);
                [setError, setCopySuccess, setDownloadSuccess, setGeneratedText, setVisualContent, setStatus].forEach(f => f(''));

                try {
                    const topicDetails = cybersecurityTopics[topic];
                    let post;

                    setStatus('✨ Crafting impactful message...');
                    let postPrompt = getPostPrompt(topicDetails);
                    
                    if (textLength === 'bollywood' && contentType === 'generic') {
                        setStatus('🎬 Directing Bollywood story...');
                        const storyAngleJson = await callGemini(postPrompt, apiKey, true);
                        let storyAngle;
                        try { storyAngle = JSON.parse(storyAngleJson); } catch { storyAngle = {character: "a person", plot: "a scam"}; }
                        
                        setStatus('✍️ Writing your blockbuster...');
                        const storytellerPrompt = `Act as a master storyteller. Write a short, immersive, and dramatic micro-story based on these details:\n- **Topic:** "${topicDetails.title}"\n- **Character:** ${storyAngle.character}\n- **Plot:** ${storyAngle.plot}\nTONE: Cinematic and simple English, with a clear Indian setting and context.\n**IMPORTANT:** Write a seamless story. DO NOT use structural labels. The story must flow naturally and conclude with a simple, powerful moral. Start with a title like "**${topicDetails.title}: A Micro-Story** 🎬". #CyberSecurity #Storytelling`;
                        post = await callGemini(storytellerPrompt, apiKey);
                    } else {
                        post = await callGemini(postPrompt, apiKey);
                    }

                    const cleanedPost = post.replace(/\*\*|\*/g, '').trim();
                    setGeneratedText(cleanedPost);

                    setStatus('🎨 Composing visual storyboard...');
                    let images = [];
                    
                    if (backgroundType === 'canvas') {
                        setStatus('🎨 Creating artistic backgrounds...');
                        images = [generateCanvas(topicDetails.colors, Date.now())];
                    } else {
                        let imageGenPrompt, statusMsg;
                        if (backgroundType === 'comic') {
                            setStatus('🎬 Directing comic art...');
                            const comicContext = `You are an AI art director. Read this text: "${cleanedPost}". Write a single, detailed prompt for an AI image generator to create a 3-panel comic strip that tells this story visually. The characters must be visibly **Indian**. Each panel should have a clean, designated space for text. Describe the scene, character, and action for each panel. The image must not contain any text or speech bubbles itself. Style: Modern, clean comic art, bold inks, cinematic colors.`;
                            imageGenPrompt = await callGemini(comicContext, apiKey);
                            statusMsg = '✍️ Illustrating contextual comic...';
                        } else { // cinematic
                            setStatus('🎬 Directing cinematic infographic...');
                            const cinematicContext = `You are an AI art director. Read this text: "${cleanedPost}". It contains key points. Write a single, detailed prompt for an AI image generator to create a professional 3-panel triptych infographic. The visual must feature **Indian people and settings**. Each panel should visually represent one of the key points, leaving a clean, designated area within each panel for text. Describe the iconography, scene, and mood. The image must not contain any text itself. Style: Cinematic, moody lighting, professional, high-tech aesthetic.`;
                            imageGenPrompt = await callGemini(cinematicContext, apiKey);
                            statusMsg = '📸 Generating contextual infographic...';
                        }
                        setStatus(statusMsg);
                        const generatedImage = await generateHighQualityImage(imageGenPrompt, apiKey);
                        images = [generatedImage || generateCanvas(topicDetails.colors, Date.now())];
                    }
                    
                    setVisualContent({ images, text: cleanedPost });
                    setStatus('✅ Insight ready!');

                } catch (err) {
                    console.error(err);
                    setError(`Error: ${err.message}`);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleCopy = () => {
                if (generatedText) {
                    navigator.clipboard.writeText(generatedText).then(() => {
                        setCopySuccess('Copied!');
                        setTimeout(() => setCopySuccess(''), 2000);
                    });
                }
            };

            const handleDownloadImage = async () => {
                if (!visualContent || !visualContent.images || visualContent.images.length === 0) return;
                setDownloadSuccess('Preparing...');
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 1080; canvas.height = 1080;
                    const ctx = canvas.getContext('2d');
                    const { images } = visualContent;
                    
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.src = images[0];
                    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; });
                    
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    const link = document.createElement('a');
                    link.download = `CyberGuard_${topic.replace(/_/g, '')}_${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    setDownloadSuccess('Downloaded!');
                    setTimeout(() => setDownloadSuccess(''), 2000);
                } catch (e) {
                    console.error("Download failed:", e);
                    setError('Download failed.');
                    setDownloadSuccess('');
                }
            };
            
            const availableTextLengths = contentType === 'technical' ? technicalTextLengths : genericTextLengths;

            return (
                <div className="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-white min-h-screen flex flex-col xl:flex-row p-4 sm:p-6 gap-4 sm:gap-6">
                    <div className="xl:w-1/3 bg-gray-800/90 backdrop-blur p-4 sm:p-6 rounded-2xl shadow-2xl border border-gray-700/50 flex flex-col gap-3 sm:gap-4 max-h-screen overflow-y-auto">
                        <div className="border-b border-cyan-500/30 pb-3 sm:pb-4">
                            <h1 className="text-2xl sm:text-3xl font-black bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">CyberGuard AI</h1>
                            <p className="text-gray-400 text-xs sm:text-sm mt-1">The Ultimate Edition</p>
                        </div>

                        <div className="flex flex-col gap-2">
                            <label className="text-xs sm:text-sm font-medium text-gray-300">Gemini API Key</label>
                            <input type="password" value={apiKey} onChange={(e)=>setApiKey(e.target.value)} placeholder="Enter API key" className="w-full p-2 sm:p-3 bg-gray-700/80 border border-gray-600 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:outline-none text-xs sm:text-sm"/>
                            <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-xs text-cyan-400 hover:text-cyan-300">Get key →</a>
                        </div>
                        
                        <div>
                            <label className="text-xs sm:text-sm font-medium text-gray-300 mb-2 block">Content Type</label>
                            <div className="flex bg-gray-700/50 rounded-lg p-1">
                                <button onClick={()=>setContentType('generic')} className={`w-1/2 p-1.5 sm:p-2 rounded-md text-xs sm:text-sm font-semibold transition ${contentType==='generic'?'bg-cyan-500 text-white shadow-lg':'hover:bg-gray-600'}`}>Generic</button>
                                <button onClick={()=>setContentType('technical')} className={`w-1/2 p-1.5 sm:p-2 rounded-md text-xs sm:text-sm font-semibold transition ${contentType==='technical'?'bg-cyan-500 text-white shadow-lg':'hover:bg-gray-600'}`}>Technical</button>
                            </div>
                        </div>

                        {platform === 'linkedin' && (
                            <div>
                                <label className="text-xs sm:text-sm font-medium text-gray-300 mb-2 block">Content Format</label>
                                <select value={textLength} onChange={(e)=>setTextLength(e.target.value)} className="w-full p-2 sm:p-3 bg-gray-700/80 border border-gray-600 rounded-lg text-xs sm:text-sm focus:ring-2 focus:ring-cyan-500">
                                    {Object.entries(availableTextLengths).map(([k,v])=><option key={k} value={k}>{v.name} ({v.desc})</option>)}
                                </select>
                            </div>
                        )}

                        <div>
                            <label className="text-xs sm:text-sm font-medium text-gray-300 mb-2 block">Cybersecurity Topic</label>
                            <select value={topic} onChange={(e)=>setTopic(e.target.value)} className="w-full p-2 sm:p-3 bg-gray-700/80 border border-gray-600 rounded-lg text-xs sm:text-sm focus:ring-2 focus:ring-cyan-500">
                                {Object.entries(cybersecurityTopics).map(([k,v])=><option key={k} value={k}>{v.emoji} {v.title}</option>)}
                            </select>
                        </div>

                        <div>
                            <label className="text-xs sm:text-sm font-medium text-gray-300 mb-2 block">Visual Style</label>
                            <select value={backgroundType} onChange={(e)=>setBackgroundType(e.target.value)} className="w-full p-1.5 sm:p-2 bg-gray-700/80 border border-gray-600 rounded-lg text-xs sm:text-sm focus:ring-2 focus:ring-cyan-500">
                                {Object.entries(backgroundTypes).map(([k,v])=><option key={k} value={k}>{v}</option>)}
                            </select>
                        </div>
                        
                        <div className="mt-2 pt-3 sm:pt-4 border-t border-gray-700/50">
                            <button onClick={handleGenerate} disabled={isLoading} className="w-full bg-gradient-to-r from-cyan-500 via-blue-500 to-purple-600 hover:from-cyan-600 hover:via-blue-600 hover:to-purple-700 text-white font-bold py-2.5 sm:py-3 px-4 rounded-lg text-sm sm:text-base transition-all transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none flex items-center justify-center gap-2 shadow-xl">
                                {isLoading ? <Spinner/> : '✨'}
                                <span>{isLoading ? 'Generating...' : 'Generate Content'}</span>
                            </button>
                            {isLoading && status && <p className="text-xs text-center text-cyan-400 mt-2 animate-pulse">{status}</p>}
                        </div>

                        {error && <div className="bg-red-900/50 border border-red-700 text-red-200 p-2 sm:p-3 rounded-lg text-xs">{error}</div>}
                    </div>

                    <div className="xl:w-2/3 flex flex-col gap-4 sm:gap-6">
                        {isLoading ? (
                            <div className="flex-grow flex flex-col items-center justify-center bg-gray-800/90 backdrop-blur p-6 rounded-2xl shadow-2xl border border-gray-700/50">
                                <Spinner size="lg"/>
                                <p className="mt-4 text-base sm:text-lg text-gray-300">{status}</p>
                                <p className="text-xs sm:text-sm text-gray-500 mt-2">Crafting high-impact content...</p>
                            </div>
                        ) : (
                            <div className="flex flex-col lg:flex-row gap-4 sm:gap-6 flex-grow">
                                <div className="lg:w-1/2 bg-gray-800/90 backdrop-blur p-4 sm:p-6 rounded-2xl shadow-2xl border border-gray-700/50 flex flex-col">
                                    <div className="flex justify-between items-center border-b border-gray-700/50 pb-3 mb-4">
                                        <h2 className="text-base sm:text-lg font-bold text-gray-200">
                                            📝 Post Content
                                            {platform === 'linkedin' && <span className="text-xs text-gray-500 ml-2">({(availableTextLengths[textLength] || {}).name})</span>}
                                        </h2>
                                        <button onClick={handleCopy} disabled={!generatedText} className="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-semibold py-1.5 sm:py-2 px-2 sm:px-3 rounded-lg text-xs sm:text-sm disabled:opacity-50 transition">
                                            {copySuccess || '📋 Copy'}
                                        </button>
                                    </div>
                                    <div className="flex-grow overflow-y-auto text-gray-300 whitespace-pre-wrap text-xs sm:text-sm leading-relaxed">
                                        {generatedText || (
                                            <div className="flex flex-col items-center justify-center h-full text-gray-500 text-xs sm:text-sm text-center">
                                                <p className="text-cyan-400 font-semibold mb-2">🎬 Your Ultimate Content Awaits</p>
                                                <p>Select your options and generate truly unique, thought-provoking content.</p>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="lg:w-1/2 bg-gray-800/90 backdrop-blur p-4 sm:p-6 rounded-2xl shadow-2xl border border-gray-700/50 flex flex-col">
                                    <div className="flex justify-between items-center border-b border-gray-700/50 pb-3 mb-4">
                                        <h2 className="text-base sm:text-lg font-bold text-gray-200">🎨 Visual Storyboard</h2>
                                        <div className="flex gap-2 items-center">
                                            {visualContent && (
                                                <button onClick={handleDownloadImage} disabled={downloadSuccess === 'Preparing...'} className="bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-semibold py-1 px-2 rounded text-xs transition disabled:opacity-50">
                                                    {downloadSuccess || '⬇ Download'}
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                    <div className="flex-grow aspect-square bg-gray-900 rounded-lg flex items-center justify-center overflow-hidden shadow-inner">
                                        {visualContent ? <img src={visualContent.images[0]} alt="Generated Visual" className="w-full h-full object-cover"/> : (
                                            <div className="text-center text-gray-500 text-xs sm:text-sm">
                                                <p className="text-cyan-400 font-semibold mb-2">🖼️ Visual Preview</p>
                                                <p className="text-xs text-gray-600">Your custom infographic or comic will appear here.</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const Spinner = ({size='sm'}) => (
            <svg className={`animate-spin ${size==='sm'?'h-5 w-5':'h-10 w-10'} text-white`} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
