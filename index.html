        const getIndianImagePrompts = (topicKey) => {
            const strictNoText = "All screens (laptops, phones) must be depicted as either glowing with an abstract pattern, showing generic code, or being slightly out of focus. Crucially, they must not contain any discernible text, letters, or logos. The entire image must contain absolutely NO TEXT, WORDS, or LETTERS."
            const prompts = {
                phishing: [
                    `Cinematic, dramatic shot: Close-up on the face of an Indian office worker in a dimly lit Mumbai high-rise office at night. His face is illuminated only by the glow of his laptop. Wide eyes, tense expression. High contrast, cinematic color grading. Bottom third is dark and clear for text overlay. ${strictNoText}`,

                ],

                ],
                remote_work: [

        const generateCanvas = (colors, seed) => {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = 1080;
            const ctx = canvas.getContext('2d');

            const styles = ['gradient', 'geometric', 'abstract', 'waves', 'particles'];
            const style = styles[Math.floor((seed * 7) % styles.length)];
            const c1 = colors[Math.floor((seed * 3) % colors.length)];
            const c2 = colors[Math.floor((seed * 5) % colors.length)];

            if (style === 'gradient') {
                const directions = [[0,0,1080,1080], [1080,0,0,1080], [540,0,540,1080], [0,540,1080,540]];
                const dir = directions[Math.floor((seed * 11) % directions.length)];
                const grad = ctx.createLinearGradient(...dir);
                grad.addColorStop(0, c1);
                grad.addColorStop(0.5, '#1a1a2e');
                grad.addColorStop(1, c2);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 1080, 1080);

                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                for(let i=0; i<5; i++) {
                    ctx.beginPath();
                    ctx.arc((seed*i*13)%1080, (seed*i*17)%1080, 100+(seed*i)%150, 0, Math.PI*2);
                    ctx.fill();
                }
            } else if (style === 'geometric') {
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(0, 0, 1080, 1080);
                ctx.strokeStyle = c1;
                ctx.lineWidth = 3;
                ctx.globalAlpha = 0.4;
                for(let i=0; i<25; i++) {
                    const x = (seed*i*23)%1080, y = (seed*i*29)%1080, s = 50+(seed*i*7)%120;
                    if(i%3===0) ctx.strokeRect(x, y, s, s);
                    else if(i%3===1) { ctx.beginPath(); ctx.arc(x,y,s/2,0,Math.PI*2); ctx.stroke(); }
                    else { ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+s,y); ctx.lineTo(x+s/2,y+s); ctx.closePath(); ctx.stroke(); }
                }
                ctx.globalAlpha = 1;
            } else if (style === 'waves') {
                const grad = ctx.createLinearGradient(0, 0, 0, 1080);
                grad.addColorStop(0, c1);
                grad.addColorStop(1, '#0a0a1a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 1080, 1080);
                ctx.strokeStyle = c2;
                ctx.lineWidth = 3;
                ctx.globalAlpha = 0.5;
                for(let w=0; w<6; w++) {
                    ctx.beginPath();
                    for(let x=0; x<1080; x+=5) {
                        const y = 540 + Math.sin((x+seed*w)/50)*(100+w*40);
                        if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                    }
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
            } else if (style === 'particles') {
                const grad = ctx.createRadialGradient(540,540,0,540,540,700);
                grad.addColorStop(0, c2);
                grad.addColorStop(1, '#050510');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 1080, 1080);
                for(let i=0; i<120; i++) {
                    const size = 2+((seed*i*61)%6);
                    const alpha = 0.3+((seed*i*67)%7)/10;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = i%2===0 ? c1 : c2;
                    ctx.beginPath();
                    ctx.arc((seed*i*71)%1080, (seed*i*73)%1080, size, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            } else {
                const rad = ctx.createRadialGradient(540,540,0,540,540,700);
                rad.addColorStop(0, c1);
                rad.addColorStop(1, '#000');
                ctx.fillStyle = rad;
                ctx.fillRect(0, 0, 1080, 1080);
                ctx.strokeStyle = c2;
                ctx.lineWidth = 4;
                ctx.globalAlpha = 0.5;
                for(let i=0; i<20; i++) {
                    ctx.beginPath();
                    ctx.moveTo((seed*i*31)%1080, (seed*i*37)%1080);
                    ctx.lineTo((seed*i*41)%1080, (seed*i*43)%1080);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }

            const vig = ctx.createRadialGradient(540,540,360,540,540,880);
            vig.addColorStop(0, 'rgba(0,0,0,0)');
            vig.addColorStop(1, 'rgba(0,0,0,0.5)');
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, 1080, 1080);

            return canvas.toDataURL('image/png');
        };

        function CybersecurityContentPlatform() {
            const [apiKey, setApiKey] = useState('');
            const [platform, setPlatform] = useState('linkedin');
            const [topic, setTopic] = useState('phishing');
            const [audience, setAudience] = useState('employees');
            const [tone, setTone] = useState('professional');
            const [textLength, setTextLength] = useState('medium');
            const [backgroundType, setBackgroundType] = useState('canvas');
            const [fontStyle, setFontStyle] = useState('modern');
            const [format, setFormat] = useState('single');

            const [generatedText, setGeneratedText] = useState('');
            const [visualContent, setVisualContent] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');
            const [copySuccess, setCopySuccess] = useState('');
            const [downloadSuccess, setDownloadSuccess] = useState('');
            const [status, setStatus] = useState('');
            const [generationCount, setGenerationCount] = useState(0);
            const [uniquenessScore, setUniquenessScore] = useState(100);
            const [currentSlide, setCurrentSlide] = useState(0);

            useEffect(() => { setFormat(platformFormats[platform][0].value); }, [platform]);

            useEffect(() => {
                if (visualContent) {
                    setCurrentSlide(0);
                }
            }, [visualContent]);

            const callGemini = async (prompt, key) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${key}`;
                const tempVariation = 1.3 + (Math.random() * 0.4); 
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { 
                            temperature: tempVariation,
                            topK: 35 + Math.floor(Math.random() * 10),
                            topP: 0.92 + (Math.random() * 0.06), 
                            maxOutputTokens: 2048 
                        }
                    })
                });
                if (!res.ok) throw new Error(`API error: ${res.status} ${res.statusText}`);
                const data = await res.json();
                
                if (!data.candidates || data.candidates.length === 0) {
                    if (data.promptFeedback && data.promptFeedback.blockReason) {
                        return `Content generation failed because the prompt was blocked for: ${data.promptFeedback.blockReason}. Please try a different topic or adjust your settings.`;
                    }
                    return 'Content generation failed. The model returned an empty response. Please try again.';
                }
                
                return data.candidates[0].content.parts[0].text;
            };

            const generateImagen4 = async (prompt, key) => {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key=${key}`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            instances: [{ prompt: prompt }],
                            parameters: { sampleCount: 1, aspectRatio: "1:1", outputFormat: "png" }
                        })
                    });
                    if (!res.ok) return null;
                    const data = await res.json();
                    const img = data?.predictions?.[0]?.bytesBase64Encoded;
                    return img ? `data:image/png;base64,${img}` : null;
                } catch (e) {
                    return null;
                }
            };
            
            const generateGeminiNative = async (prompt, key) => {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${key}`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: `Generate a photorealistic, professional, high-quality image for a cybersecurity awareness post, 1:1 aspect ratio. The scene should be: ${prompt}` }]
                            }],
                            generationConfig: {
                                responseModalities: ["IMAGE"],
                                temperature: 1.0,
                                maxOutputTokens: 8192,
                            }
                        })
                    });
                     if (!res.ok) {
                        console.error("Gemini Native API Error:", await res.text());
                        return null;
                    }
                    const data = await res.json();
                    const inlineData = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData;
                    if (inlineData && inlineData.data) {
                        return `data:${inlineData.mimeType};base64,${inlineData.data}`;
                    }
                    console.error("No image data found in Gemini Native response", data);
                    return null;
                } catch (e) {
                    console.error("Error calling generateGeminiNative:", e);
                    return null;
                }
            };

            const handleGenerate = async () => {
                if (!apiKey || apiKey.length < 10) {
                    setError('Please enter valid API key');
                    return;
                }

                setIsLoading(true);
                setError('');
                setCopySuccess('');
                setDownloadSuccess('');
                setGeneratedText('');
                setVisualContent(null);
                setStatus('');

                try {
                    const topicDetails = cybersecurityTopics[topic];
                    const isCarousel = format === 'carousel';
                    const isInstagram = platform === 'instagram';
                    const uniqueSeed = Date.now() + generationCount * 12345;

                    const uniquenessFactors = [
                        Math.random() * 20,
                        generationCount * 2,
                        (uniqueSeed % 100) / 5
                    ];
                    const calculatedUniqueness = Math.min(100, 75 + uniquenessFactors.reduce((a,b) => a+b, 0));
                    setUniquenessScore(Math.round(calculatedUniqueness));

                    setStatus('🎲 Calculating unique variation...');

                    const hookStyle = hookStyles[generationCount % hookStyles.length];
                    
                    let hook, post;

                    if (isInstagram) {
                        setStatus('✨ Creating unignorable hook...');
                        hook = await callGemini(`Create ONE extremely compelling, unignorable hook for Instagram about "${topicDetails.title}" for ${targetAudiences[audience]}.
Style: ${hookStyle}.
Max 10 words. Indian context. NO emojis. It must create immediate intrigue or urgency.
Generation #${generationCount + 1} - Make it BOLD and different.
Write ONE UNIQUE hook:`, apiKey);

                        setStatus('📱 Writing powerful caption...');
                        post = await callGemini(`Write a short, powerful Instagram caption about "${topicDetails.title}" for ${targetAudiences[audience]}.
FIRST LINE: ${hook.trim()}
UNIQUENESS INSTRUCTION: Generation #${generationCount + 1}. Use punchy, evocative language.
FORMAT: 100-150 words, LINE BREAKS, 2-3 short paragraphs, quick tips, a strong CTA, 8-10 relevant hashtags, 3-4 emojis, ${tones[tone]} tone.
NO markdown. Be conversational and high-impact.`, apiKey);

                    } else { // LinkedIn Logic
                        setStatus('✨ Creating training-grade hook...');
                        hook = await callGemini(`Create an extremely compelling, unignorable hook for a LinkedIn training post about "${topicDetails.title}" for ${targetAudiences[audience]}.
Style: ${hookStyle}.
The hook must create immediate intrigue or urgency, framing the topic as a critical business or personal skill. ONE powerful sentence. Indian context.
Generation #${generationCount + 1}. Be bold and professional.
Write ONE UNIQUE hook:`, apiKey);

                        setStatus('📝 Crafting professional training content...');
                        const lengthSpec = textLengths[textLength];
                        let postPrompt;
                        
                        // REWRITTEN LINKEDIN PROMPTS FOR TRAINING-QUALITY CONTENT
                        if (textLength === 'pointers') {
                            postPrompt = `Act as a corporate cybersecurity trainer. Create a concise "micro-lesson" for a LinkedIn post about "${topicDetails.title}" for ${targetAudiences[audience]}.
HOOK: ${hook.trim()}
FORMAT: A structured micro-lesson.
TONE: Professional, educational, and authoritative.
STRUCTURE:
[Hook]
**Objective:** [State the key learning outcome in one sentence. E.g., "To identify and neutralize deceptive payment requests."]
**Key Threats:**
- **[Threat 1]:** [Brief, clear description].
- **[Threat 2]:** [Brief, clear description].
**Actionable Steps:**
1. **[Step 1]:** [A clear, direct action].
2. **[Step 2]:** [A clear, direct action].
[A strong, clear Call to Action encouraging proactive security.]
#CyberSecurityTraining #${topic.replace(/_/g, '')} #CorporateTraining #India`;
                        } else {
                            postPrompt = `Act as a corporate cybersecurity trainer. Write an in-depth, training-quality LinkedIn post about "${topicDetails.title}" for ${targetAudiences[audience]}.
HOOK: ${hook.trim()}
LENGTH: ${lengthSpec.desc}
TONE: ${tones[tone]}, authoritative, and educational.
UNIQUENESS INSTRUCTION: Use a realistic case study to illustrate the threat.
STRUCTURE:
[Hook]
**Case Study:** [Describe a brief but specific, realistic scenario. E.g., "An accountant at a firm in Bangalore receives a deceptive invoice from a cloned supplier email..."]
**The Vulnerability:** [Explain the psychological trick or technical loophole the attackers exploited in the case study.]
**Strategic Defense Plan:**
1. **[Protective Measure 1]:** [Provide a tactical, actionable step. Explain the 'why' behind it.]
2. **[Protective Measure 2]:** [Provide a tactical, actionable step. Explain the 'why' behind it.]
3. **[Protective Measure 3]:** [Provide a tactical, actionable step. Explain the 'why' behind it.]
${textLength !== 'short' ? `**Trainer's Insight:** [Provide a high-level strategic takeaway. E.g., "Attackers don't just hack systems; they hack human trust. The strongest defense is a culture of verification."]`: ''}
[**Call to Action:** A question that prompts reflection or discussion on security practices.]
#CyberSecurity #${topic.replace(/_/g, '')} #RiskManagement #ProfessionalDevelopment #India`;
                        }
                        post = await callGemini(postPrompt, apiKey);
                    }

                    const cleanedPost = post
                        .replace(/\*\*/g, '') // Remove double asterisks used for bolding
                        .replace(/\*/g, '')   // Remove single asterisks for lists/emphasis
                        .trim();

                    setGeneratedText(cleanedPost);

                    setStatus('🎨 Planning cinematic visuals...');
                    let visualPlan;

                    const visualPlanContext = `Based on the following social media post, create a compelling visual summary. Post: "${cleanedPost}"`;

                    if (isCarousel) {
                        const planText = await callGemini(`${visualPlanContext} Create a 3-slide carousel. The text must be extremely short, punchy, and directly related to the post's main points. Return ONLY JSON:
{"slides":[{"title":"2-3 words","text":"4-6 words"},{"title":"2-3 words","text":"4-6 words"},{"title":"2-3 words","text":"4-6 words"}]}
Generation #${generationCount + 1}. Make it visually memorable and logically connected to the post.`, apiKey);
                        try {
                            visualPlan = JSON.parse(planText.replace(/\`\`\`json/g,'').replace(/\`\`\`/g,'').trim());
                        } catch {
                            visualPlan = {slides:[
                                {title:"Threats Evolve",text:"So should your defense"},
                                {title:"Doubt Everything",text:"Verify before you trust"},
                                {title:"You Are The Shield",text:"Your actions matter most"}
                            ]};
                        }
                    } else {
                        const planText = await callGemini(`${visualPlanContext} Create a single visual concept. The title and points must summarize the most critical advice from the post. Return ONLY JSON:
{"title":"2-4 POWERFUL words","points":["4-6 impactful words","4-6 impactful words","4-6 impactful words"]}
Generation #${generationCount + 1}. Make it memorable and directly relevant.`, apiKey);
                        try {
                            visualPlan = JSON.parse(planText.replace(/\`\`\`json/g,'').replace(/\`\`\`/g,'').trim());
                        } catch {
                            visualPlan = {title:"DEFEND YOUR DIGITAL",points:["Think before the click","Strong passkeys are essential","MFA is not optional"]};
                        }
                    }

                    const slides = isCarousel ? visualPlan.slides : [visualPlan];
                    let images = [];

                    if (backgroundType === 'canvas') {
                        setStatus('🎨 Creating artistic backgrounds...');
                        images = slides.map((_, i) => generateCanvas(topicDetails.colors, uniqueSeed + i*1000));
                    } else {
                        const indianPrompts = getIndianImagePrompts(topic);
                        if (backgroundType === 'imagen4') {
                            setStatus('📸 Generating cinematic photos (30-45s)...');
                            const imagePromises = slides.map((_, i) => {
                                const promptIndex = (uniqueSeed + i) % indianPrompts.length;
                                return generateImagen4(indianPrompts[promptIndex], apiKey);
                            });
                            const results = await Promise.all(imagePromises);
                            images = results.map((img, i) => img || generateCanvas(topicDetails.colors, uniqueSeed + i*1000));
                        } else { // gemini_native
                            setStatus('🖼️ Generating AI images (20-30s)...');
                            const imagePromises = slides.map((_, i) => {
                                const promptIndex = (uniqueSeed + i) % indianPrompts.length;
                                return generateGeminiNative(indianPrompts[promptIndex], apiKey);
                            });
                            const results = await Promise.all(imagePromises);
                            images = results.map((img, i) => img || generateCanvas(topicDetails.colors, uniqueSeed + i*1000));
                        }
                    }

                    setVisualContent({ images, plan: visualPlan, isCarousel });
                    setStatus('✅ Training content ready!');
                    setGenerationCount(prev => prev + 1);

                } catch (err) {
                    console.error(err);
                    setError(`Error: ${err.message}`);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleCopy = () => {
                if (generatedText) {
                    navigator.clipboard.writeText(generatedText).then(() => {
                        setCopySuccess('Copied!');
                        setTimeout(() => setCopySuccess(''), 2000);
                    });
                }
            };

            const handleDownloadImage = async () => {
                if (!visualContent || !visualContent.images || visualContent.images.length === 0) return;

                setDownloadSuccess('Preparing...');

                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 1080;
                    canvas.height = 1080;
                    const ctx = canvas.getContext('2d');

                    const { images, plan, isCarousel } = visualContent;
                    const currentImageSrc = images[currentSlide];
                    const currentPlan = isCarousel ? plan.slides[currentSlide] : plan;
                    const currentFontStyle = fontStyles[fontStyle];

                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.src = currentImageSrc;
                    await new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = (e) => reject(new Error("Image failed to load for download canvas."));
                    });
                    
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    const gradient = ctx.createLinearGradient(0, canvas.height, 0, canvas.height / 2);
                    gradient.addColorStop(0, 'rgba(0,0,0,0.9)');
                    gradient.addColorStop(0.7, 'rgba(0,0,0,0.4)');
                    gradient.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.fillStyle = 'white';
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
                    ctx.shadowBlur = 10;
                    ctx.shadowOffsetY = 2;

                    const padding = 80;
                    const contentWidth = canvas.width - (padding * 2);

                    const wrapText = (context, text, x, y, maxWidth, lineHeight) => {
                        const words = text.split(' ');
                        let line = '';
                        let currentY = y;
                        for (let n = 0; n < words.length; n++) {
                            const testLine = line + words[n] + ' ';
                            const metrics = context.measureText(testLine);
                            if (metrics.width > maxWidth && n > 0) {
                                context.fillText(line, x, currentY);
                                line = words[n] + ' ';
                                currentY += lineHeight;
                            } else {
                                line = testLine;
                            }
                        }
                        context.fillText(line, x, currentY);
                        return currentY - y + lineHeight;
                    };


                    if (isCarousel) {
                        ctx.font = `600 52px ${currentFontStyle.font}`;
                        const textHeight = wrapText(ctx, currentPlan.text, padding, canvas.height - padding - 62, contentWidth, 62);
                        
                        ctx.font = `${currentFontStyle.weight} 95px ${currentFontStyle.font}`;
                        wrapText(ctx, currentPlan.title, padding, canvas.height - padding - textHeight - 40, contentWidth, 105);
                    } else {
                        const points = currentPlan.points || [];
                        let yPos = canvas.height - padding;

                        ctx.font = `600 42px ${currentFontStyle.font}`;
                        [...points].reverse().forEach(point => {
                            const pointText = `✓  ${point}`;
                            const textHeight = wrapText(ctx, pointText, padding, yPos - 42, contentWidth, 50);
                            yPos -= (textHeight + 20); 
                        });
                        
                        yPos -= 40;

                        ctx.font = `${currentFontStyle.weight} 90px ${currentFontStyle.font}`;
                        wrapText(ctx, currentPlan.title, padding, yPos - 100, contentWidth, 100);
                    }

                    const link = document.createElement('a');
                    const topicName = cybersecurityTopics[topic].title.replace(/[^a-z0,9]/gi, '_');
                    link.download = `CyberGuard_${topicName}_${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    setDownloadSuccess('Downloaded!');
                    setTimeout(() => setDownloadSuccess(''), 2000);
                } catch (e) {
                    console.error("Failed to create image for download:", e);
                    setError('Download failed. Please try another background.');
                    setDownloadSuccess('');
                }
            };

            return (
                <div className="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-white min-h-screen flex flex-col xl:flex-row p-4 sm:p-6 gap-4 sm:gap-6">
                    <div className="xl:w-1/3 bg-gray-800/90 backdrop-blur p-4 sm:p-6 rounded-2xl shadow-2xl border border-gray-700/50 flex flex-col gap-3 sm:gap-4 max-h-screen overflow-y-auto">
                        <div className="border-b border-cyan-500/30 pb-3 sm:pb-4">
                            <h1 className="text-2xl sm:text-3xl font-black bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">CyberGuard AI</h1>
                            <p className="text-gray-400 text-xs sm:text-sm mt-1">Professional Cybersecurity Training Content</p>
                            {generationCount > 0 && (
                                <div className="mt-2 flex items-center gap-2">
                                    <div className="flex-grow bg-gray-700 rounded-full h-2">
                                        <div className="bg-gradient-to-r from-cyan-500 to-blue-600 h-2 rounded-full transition-all" style={{width: `${uniquenessScore}%`}}></div>
                                    </div>
                                    <span className="text-xs text-cyan-400 font-bold">{uniquenessScore}%</span>
                                </div>
                            )}
                        </div>

                        <div className="flex flex-col gap-2">
                            <label className="text-xs sm:text-sm font-medium text-gray-300">Gemini API Key</label>
                            <input type="password" value={apiKey} onChange={(e)=>setApiKey(e.target.value)} placeholder="Enter API key" className="w-full p-2 sm:p-3 bg-gray-700/80 border border-gray-600 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:outline-none text-xs sm:text-sm"/>
                            <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-xs text-cyan-400 hover:text-cyan-300">Get key →</a>
                        </div>

                        <div className="grid grid-cols-2 gap-2 sm:gap-3">
                            <div>
                                <label className="text-xs sm:text-sm font-medium text-gray-300 mb-2 block">Platform</label>
                                <div className="flex bg-gray-700/50 rounded-lg p-1">
                                    <button onClick={()=>setPlatform('linkedin')} className={`w-1/2 p-1.5 sm:p-2 rounded-md text-xs sm:text-sm font-semibold transition ${platform==='linkedin'?'bg-cyan-500 text-white shadow-lg':'hover:bg-gray-600'}`}>LinkedIn</button>
                                    <button onClick={()=>setPlatform('instagram')} className={`w-1/2 p-1.5 sm:p-2 rounded-md text-xs sm:text-sm font-semibold transition ${platform==='instagram'?'bg-cyan-500 text-white shadow-lg':'hover:bg-gray-600'}`}>Instagram</button>
                                </div>
                            </div>
                            <div>
                                <label className="text-xs sm:text-sm font-medium text-gray-300 mb-2 block">Format</label>
                                <select value={format} onChange={(e)=>setFormat(e.target.value)} className="w-full p-1.5 sm:p-2 bg-gray-700/80 border border-gray-600 rounded-lg text-xs sm:text-sm focus:ring-2 focus:ring-cyan-500">
                                    {platformFormats[platform].map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
                                </select>
                            </div>
                        </div>

                        {platform === 'linkedin' && (
                            <div>
                                <label className="text-xs sm:text-sm font-medium text-gray-300 mb-2 block">Content Length</label>
                                <select value={textLength} onChange={(e)=>setTextLength(e.target.value)} className="w-full p-2 sm:p-3 bg-gray-700/80 border border-gray-600 rounded-lg text-xs sm:text-sm focus:ring-2 focus:ring-cyan-500">
                                    {Object.entries(textLengths).map(([k,v])=><option key={k} value={k}>{v.name} ({v.desc})</option>)}
                                </select>
                            </div>
                        )}

                        <div>
                            <label className="text-xs sm:text-sm font-medium text-gray-300 mb-2 block">Training Topic ({Object.keys(cybersecurityTopics).length} available)</label>
                            <select value={topic} onChange={(e)=>setTopic(e.target.value)} className="w-full p-2 sm:p-3 bg-gray-700/80 border border-gray-600 rounded-lg text-xs sm:text-sm focus:ring-2 focus:ring-cyan-500">
                                {Object.entries(cybersecurityTopics).map(([k,v])=><option key={k} value={k}>{v.emoji} {v.title}</option>)}
                            </select>
                        </div>

                        <div className="grid grid-cols-2 gap-2 sm:gap-3">
                            <div>
                                <label className="text-xs sm:text-sm font-medium text-gray-300 mb-2 block">Target Audience</label>
                                <select value={audience} onChange={(e)=>setAudience(e.target.value)} className="w-full p-1.5 sm:p-2 bg-gray-700/80 border border-gray-600 rounded-lg text-xs sm:text-sm focus:ring-2 focus:ring-cyan-500">
                                    {Object.entries(targetAudiences).map(([k,v])=><option key={k} value={k}>{v}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-xs sm:text-sm font-medium text-gray-300 mb-2 block">Tone of Voice</label>
                                <select value={tone} onChange={(e)=>setTone(e.target.value)} className="w-full p-1.5 sm:p-2 bg-gray-700/80 border border-gray-600 rounded-lg text-xs sm:text-sm focus:ring-2 focus:ring-cyan-500">
                                    {Object.entries(tones).map(([k,v])=><option key={k} value={k}>{v}</option>)}
                                </select>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-2 sm:gap-3">
                            <div>
                                <label className="text-xs sm:text-sm font-medium text-gray-300 mb-2 block">Visual Style</label>
                                <select value={backgroundType} onChange={(e)=>setBackgroundType(e.target.value)} className="w-full p-1.5 sm:p-2 bg-gray-700/80 border border-gray-600 rounded-lg text-xs sm:text-sm focus:ring-2 focus:ring-cyan-500">
                                    {Object.entries(backgroundTypes).map(([k,v])=><option key={k} value={k}>{v}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-xs sm:text-sm font-medium text-gray-300 mb-2 block">Font Style</label>
                                <select value={fontStyle} onChange={(e)=>setFontStyle(e.target.value)} className="w-full p-1.5 sm:p-2 bg-gray-700/80 border border-gray-600 rounded-lg text-xs sm:text-sm focus:ring-2 focus:ring-cyan-500">
                                    {Object.entries(fontStyles).map(([k,v])=><option key={k} value={k}>{v.name}</option>)}
                                </select>
                            </div>
                        </div>

                        <div className="mt-2 pt-3 sm:pt-4 border-t border-gray-700/50">
                            <button onClick={handleGenerate} disabled={isLoading} className="w-full bg-gradient-to-r from-cyan-500 via-blue-500 to-purple-600 hover:from-cyan-600 hover:via-blue-600 hover:to-purple-700 text-white font-bold py-2.5 sm:py-3 px-4 rounded-lg text-sm sm:text-base transition-all transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none flex items-center justify-center gap-2 shadow-xl">
                                {isLoading ? <Spinner/> : '✨'}
                                <span>{isLoading ? 'Generating...' : 'Generate Training Content'}</span>
                            </button>
                            {isLoading && status && <p className="text-xs text-center text-cyan-400 mt-2 animate-pulse">{status}</p>}
                            {generationCount > 0 && !isLoading && (
                                <p className="text-xs text-center text-gray-500 mt-1">
                                    Content Generated: {generationCount}
                                </p>
                            )}
                        </div>

                        {error && <div className="bg-red-900/50 border border-red-700 text-red-200 p-2 sm:p-3 rounded-lg text-xs">{error}</div>}
                    </div>

                    <div className="xl:w-2/3 flex flex-col gap-4 sm:gap-6">
                        {isLoading ? (
                            <div className="flex-grow flex flex-col items-center justify-center bg-gray-800/90 backdrop-blur p-6 rounded-2xl shadow-2xl border border-gray-700/50">
                                <Spinner size="lg"/>
                                <p className="mt-4 text-base sm:text-lg text-gray-300">{status}</p>
                                <p className="text-xs sm:text-sm text-gray-500 mt-2">Crafting professional training material...</p>
                            </div>
                        ) : (
                            <div className="flex flex-col lg:flex-row gap-4 sm:gap-6 flex-grow">
                                <div className="lg:w-1/2 bg-gray-800/90 backdrop-blur p-4 sm:p-6 rounded-2xl shadow-2xl border border-gray-700/50 flex flex-col">
                                    <div className="flex justify-between items-center border-b border-gray-700/50 pb-3 mb-4">
                                        <h2 className="text-base sm:text-lg font-bold text-gray-200">
                                            {platform === 'instagram' ? '📱 Caption' : '📝 Training Post'}
                                            {platform === 'linkedin' && <span className="text-xs text-gray-500 ml-2">({textLengths[textLength].name})</span>}
                                        </h2>
                                        <button onClick={handleCopy} disabled={!generatedText} className="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-semibold py-1.5 sm:py-2 px-2 sm:px-3 rounded-lg text-xs sm:text-sm disabled:opacity-50 transition">
                                            {copySuccess || '📋 Copy'}
                                        </button>
                                    </div>
                                    <div className="flex-grow overflow-y-auto text-gray-300 whitespace-pre-wrap text-xs sm:text-sm leading-relaxed">
                                        {generatedText || (
                                            <div className="flex flex-col items-center justify-center h-full text-gray-500 text-xs sm:text-sm text-center">
                                                <p className="text-cyan-400 font-semibold mb-2">🎓 Professional Training Content</p>
                                                <p>Your expert cybersecurity content will appear here.</p>
                                                <p className="text-xs text-gray-600 mt-1">Case studies • Actionable advice • Trainer insights</p>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="lg:w-1/2 bg-gray-800/90 backdrop-blur p-4 sm:p-6 rounded-2xl shadow-2xl border border-gray-700/50 flex flex-col">
                                    <div className="flex justify-between items-center border-b border-gray-700/50 pb-3 mb-4">
                                        <h2 className="text-base sm:text-lg font-bold text-gray-200">🎨 Training Visual</h2>
                                        <div className="flex gap-2 items-center">
                                            <span className="text-xs text-gray-400">{fontStyles[fontStyle].name}</span>
                                            {visualContent && (
                                                <button onClick={handleDownloadImage} disabled={downloadSuccess === 'Preparing...'} className="bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-semibold py-1 px-2 rounded text-xs transition disabled:opacity-50">
                                                    {downloadSuccess || '⬇ Download'}
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                    <div className="flex-grow aspect-square bg-gray-900 rounded-lg flex items-center justify-center overflow-hidden shadow-inner">
                                        {visualContent ? <VisualDisplay 
                                            content={visualContent} 
                                            fontStyle={fontStyles[fontStyle]}
                                            currentSlide={currentSlide}
                                            setCurrentSlide={setCurrentSlide}
                                        /> : (
                                            <div className="text-center text-gray-500 text-xs sm:text-sm">
                                                <p className="text-cyan-400 font-semibold mb-2">🖼️ Visual preview</p>
                                                <p className="text-xs text-gray-600">Visuals will be generated here.</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const VisualDisplay = ({content, fontStyle, currentSlide, setCurrentSlide}) => {
            if (!content) return null;

            const {images, plan, isCarousel} = content;
            const slides = isCarousel ? plan.slides : [plan];

            return (
                <div className="relative w-full h-full bg-black">
                    {images.map((image, i) => {
                        const slide = slides[i];
                        const isActive = i === currentSlide;
                        return (
                            <div key={i} className={`absolute inset-0 transition-opacity duration-500 ${isActive ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                                <img src={image} alt={`Slide ${i+1}`} className="w-full h-full object-cover"/>
                                <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/60 to-transparent" />
                                <div className="absolute inset-0 flex flex-col justify-end p-8 sm:p-10 text-white">
                                    {isCarousel ? (
                                        <div className="mb-10 drop-shadow-lg">
                                            <h2 className="text-4xl sm:text-5xl md:text-6xl font-black mb-3 leading-tight" style={{fontFamily:fontStyle.font,fontWeight:fontStyle.weight}}>{slide.title}</h2>
                                            <p className="text-xl sm:text-2xl md:text-3xl font-semibold" style={{fontFamily:fontStyle.font}}>{slide.text}</p>
                                        </div>
                                    ) : (
                                         <div className="mb-6 drop-shadow-lg">
                                            <h2 className="text-4xl sm:text-5xl md:text-6xl font-black mb-5 leading-tight" style={{fontFamily:fontStyle.font,fontWeight:fontStyle.weight}}>{slide.title}</h2>
                                            <ul className="space-y-3">
                                                {slide.points && slide.points.map((p,pi)=>(
                                                    <li key={pi} className="flex items-center text-lg sm:text-xl md:text-2xl">
                                                        <span className="text-cyan-400 mr-3 text-2xl sm:text-3xl flex-shrink-0">✓</span>
                                                        <span className="font-semibold" style={{fontFamily:fontStyle.font}}>{p}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}
                                </div>
                            </div>
                        );
                    })}
                    {isCarousel && slides.length > 1 && (
                        <>
                            <button onClick={()=>setCurrentSlide((p)=>(p-1+slides.length)%slides.length)} className="absolute left-2 sm:left-3 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black/80 text-white p-2 sm:p-3 rounded-full z-10 transition">←</button>
                            <button onClick={()=>setCurrentSlide((p)=>(p+1)%slides.length)} className="absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black/80 text-white p-2 sm:p-3 rounded-full z-10 transition">→</button>
                            <div className="absolute bottom-3 sm:bottom-4 left-1/2 -translate-x-1/2 flex gap-1.5 sm:gap-2 z-10">
                                {slides.map((_,i)=><div key={i} onClick={()=>setCurrentSlide(i)} className={`h-2 sm:h-3 rounded-full cursor-pointer transition-all ${i===currentSlide?'bg-white w-8 sm:w-10':'bg-white/50 w-2 sm:w-3'}`}/>)}
                            </div>
                        </>
                    )}
                </div>
            );
        };

        const Spinner = ({size='sm'}) => (
            <svg className={`animate-spin ${size==='sm'?'h-5 w-5':'h-10 w-10'} text-white`} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
            </svg>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CybersecurityContentPlatform/>);
    </script>
</body>
</html>
